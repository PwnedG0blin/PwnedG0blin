name: Mirravel release
on:
  push:
    branches: [master]
    paths: ['projects/Mirravel/VERSION', '.github/workflows/mirravel-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirravel-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: projects/Mirravel
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolated regression tests
        run: |
          for file in Apply.command Restore.command core.sh Mirravel.command DMG_erstellen.command scripts/build-macos.sh scripts/verify-macos.sh; do bash -n "$file"; done
          python3 -m unittest discover -s tests -v
      - name: Install pinned DMG layout tools in isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/mirravel-layout"
          "$RUNNER_TEMP/mirravel-layout/bin/python" -m pip install ds_store==1.3.3 mac_alias==2.2.3
          echo "MIRRAVEL_LAYOUT_PYTHON=$RUNNER_TEMP/mirravel-layout/bin/python" >> "$GITHUB_ENV"
      - name: Build and verify Universal App and styled DMG
        run: |
          bash scripts/build-macos.sh
          bash scripts/verify-macos.sh
          python3 scripts/package-source.py
          cd dist
          shasum -a 256 Mirravel-1.1.3-App.zip Mirravel-1.1.3-Mac.dmg Mirravel-1.1.3-Source.zip > SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          test "$(cat VERSION)" = 1.1.3
          tag=mirravel-v1.1.3
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; published files will not be overwritten.'
            exit 0
          fi
          gh release create "$tag" --target "$RELEASE_TARGET" --latest --title 'Mirravel 1.1.3' --notes-file RELEASE_NOTES.md dist/Mirravel-1.1.3-App.zip dist/Mirravel-1.1.3-Mac.dmg dist/Mirravel-1.1.3-Source.zip dist/SHA256SUMS.txt
