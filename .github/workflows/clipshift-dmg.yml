name: ClipShift DMG

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/ScreenRecordingMP4/ClipShiftApp.swift'
      - 'projects/ScreenRecordingMP4/ClipShiftArtwork.swift'
      - 'projects/ScreenRecordingMP4/RELEASE-NOTES.md'
      - 'projects/ScreenRecordingMP4/resources/**'
      - '.github/workflows/clipshift-dmg.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile ClipShift
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/ScreenRecordingMP4"
          APP="$RUNNER_TEMP/ClipShift.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>org.pwnedg0blin.clipshift</string>
          <key>CFBundleName</key><string>ClipShift</string>
          <key>CFBundleExecutable</key><string>ClipShift</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>ClipShift.icns</string>
          <key>CFBundleShortVersionString</key><string>0.2.0</string>
          <key>CFBundleVersion</key><string>2</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          <key>NSAppleEventsUsageDescription</key><string>ClipShift configures a Folder Action for Desktop recordings.</string>
          </dict></plist>
          PLIST

          mkdir -p "$RUNNER_TEMP/artwork"
          swift "$ROOT/ClipShiftArtwork.swift" "$RUNNER_TEMP/artwork/icon.png" "$RUNNER_TEMP/artwork/background.png"
          ICONSET="$RUNNER_TEMP/artwork/ClipShift.iconset"
          mkdir -p "$ICONSET"
          for SIZE in 16 32 128 256 512; do
            sips -s format png -z "$SIZE" "$SIZE" "$RUNNER_TEMP/artwork/icon.png" --out "$ICONSET/icon_${SIZE}x${SIZE}.png" >/dev/null
            DOUBLE=$((SIZE * 2))
            sips -s format png -z "$DOUBLE" "$DOUBLE" "$RUNNER_TEMP/artwork/icon.png" --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/ClipShift.icns"          cp "$ROOT/resources/convert-folder-action.sh" "$APP/Contents/Resources/"
          cp "$ROOT/resources/folder-action.applescript" "$APP/Contents/Resources/"
          swiftc -O -parse-as-library -target arm64-apple-macos13.0 "$ROOT/ClipShiftApp.swift" -o "$APP/Contents/MacOS/ClipShift"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          APP="$RUNNER_TEMP/ClipShift.app"
          brew install create-dmg
          mkdir -p "$RUNNER_TEMP/ClipShift-Volume" dist
          cp -R "$APP" "$RUNNER_TEMP/ClipShift-Volume/"
          create-dmg \
            --volname "ClipShift" \
            --volicon "$APP/Contents/Resources/ClipShift.icns" \
            --background "$RUNNER_TEMP/artwork/background.png" \
            --window-pos 220 110 \
            --window-size 760 500 \
            --text-size 13 \
            --icon-size 114 \
            --icon "ClipShift.app" 180 245 \
            --hide-extension "ClipShift.app" \
            --app-drop-link 555 245 \
            --no-internet-enable \
            "dist/ClipShift-0.2.0-beta.1-macOS-AppleSilicon.dmg" \
            "$RUNNER_TEMP/ClipShift-Volume"
          hdiutil verify "dist/ClipShift-0.2.0-beta.1-macOS-AppleSilicon.dmg"
          shasum -a 256 dist/*.dmg > dist/SHA256SUMS.txt
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ClipShift-0.2.0-beta.1-macOS-AppleSilicon
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish public GitHub beta release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="clipshift-v0.2.0-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "ClipShift 0.2.0 Beta 1 — Liquid Glass DMG" \
              --prerelease \
              --notes-file "projects/ScreenRecordingMP4/RELEASE-NOTES.md"
          fi
